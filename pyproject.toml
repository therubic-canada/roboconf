[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "roboconf"
version = "1.0.4"
authors = [
    {name = "Auguste Lalande", email = "alal@therubic.com"},
]
description = "Configuration file loading utility."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyyaml"]

[tool.setuptools]
packages = ["roboconf"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
preview = true

select = ["ALL"]
ignore = [
    # These will eventually be enabled
    "T201",      # Use of print statements
    "DOC",
    # These will not
    "CPY",
    "EM",
    "RSE102",    # Unnecessary parentheses on raised exceptions
    "SIM105",    # Use contextlib.supress
    "TID252",    # Prefer absolute imports
    "TRY003",    # Avoid specifying long messages outside the exception class
    "COM812"
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
